receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/known:
    error_mode: propagate
    traces:
      span:
        - 'name != "openclaw.message.processed" and name != "openclaw.run" and name != "openclaw.tool.execution" and name != "openclaw.message.delivery" and name != "openclaw.model.call" and name != "openclaw.model.usage"'
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - 'keep_keys(resource.attributes, ["service.name"])'
          - 'set(resource.attributes["service.name"], "friday-gateway")'
          - 'keep_keys(instrumentation_scope.attributes, [])'
          - 'set(instrumentation_scope.name, "openclaw-diagnostics")'
          - 'set(instrumentation_scope.version, "")'
          - 'set(resource.schema_url, "")'
          - 'set(scope.schema_url, "")'
          - 'keep_keys(span.attributes, ["openclaw.channel", "openclaw.outcome", "openclaw.toolName", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "gen_ai.usage.cache_read.input_tokens", "gen_ai.usage.cache_creation.input_tokens", "gen_ai.provider.name", "gen_ai.request.model", "openclaw.errorCategory", "openclaw.errorCode"])'
          - 'delete_key(span.attributes, "gen_ai.usage.input_tokens") where name != "openclaw.model.usage" and name != "openclaw.model.call"'
          - 'delete_key(span.attributes, "gen_ai.usage.output_tokens") where name != "openclaw.model.usage" and name != "openclaw.model.call"'
          - 'delete_key(span.attributes, "gen_ai.usage.cache_read.input_tokens") where name != "openclaw.model.usage" and name != "openclaw.model.call"'
          - 'delete_key(span.attributes, "gen_ai.usage.cache_creation.input_tokens") where name != "openclaw.model.usage" and name != "openclaw.model.call"'
          - 'delete_key(span.attributes, "gen_ai.usage.input_tokens") where span.attributes["gen_ai.usage.input_tokens"] != nil and not IsInt(span.attributes["gen_ai.usage.input_tokens"])'
          - 'delete_key(span.attributes, "gen_ai.usage.output_tokens") where span.attributes["gen_ai.usage.output_tokens"] != nil and not IsInt(span.attributes["gen_ai.usage.output_tokens"])'
          - 'delete_key(span.attributes, "gen_ai.usage.cache_read.input_tokens") where span.attributes["gen_ai.usage.cache_read.input_tokens"] != nil and not IsInt(span.attributes["gen_ai.usage.cache_read.input_tokens"])'
          - 'delete_key(span.attributes, "gen_ai.usage.cache_creation.input_tokens") where span.attributes["gen_ai.usage.cache_creation.input_tokens"] != nil and not IsInt(span.attributes["gen_ai.usage.cache_creation.input_tokens"])'
          - 'set(span.attributes["gen_ai.provider.name"], "other") where span.attributes["gen_ai.provider.name"] != nil and span.attributes["gen_ai.provider.name"] != "openai" and span.attributes["gen_ai.provider.name"] != "anthropic"'
          - 'set(span.attributes["gen_ai.request.model"], "other") where span.attributes["gen_ai.request.model"] != nil and span.attributes["gen_ai.request.model"] != "openai/gpt-5.6-sol" and span.attributes["gen_ai.request.model"] != "gpt-5.6-sol"'
          - 'set(span.attributes["openclaw.errorCategory"], "other") where span.attributes["openclaw.errorCategory"] != nil and span.attributes["openclaw.errorCategory"] != "timeout" and span.attributes["openclaw.errorCategory"] != "rate_limit" and span.attributes["openclaw.errorCategory"] != "authorization" and span.attributes["openclaw.errorCategory"] != "validation"'
          - 'set(span.attributes["openclaw.errorCode"], "other") where span.attributes["openclaw.errorCode"] != nil and span.attributes["openclaw.errorCode"] != "AUTH_REQUIRED" and span.attributes["openclaw.errorCode"] != "NOT_FOUND" and span.attributes["openclaw.errorCode"] != "RATE_LIMITED"'
          - 'set(span.attributes["openclaw.channel"], "other") where span.attributes["openclaw.channel"] != "slack"'
          - 'set(span.attributes["openclaw.outcome"], "other") where span.attributes["openclaw.outcome"] != "ok" and span.attributes["openclaw.outcome"] != "success" and span.attributes["openclaw.outcome"] != "error" and span.attributes["openclaw.outcome"] != "blocked"'
          - 'set(span.attributes["openclaw.toolName"], "other") where span.attributes["openclaw.toolName"] != "friday_git_pr_context" and span.attributes["openclaw.toolName"] != "friday_git_read_file" and span.attributes["openclaw.toolName"] != "friday_terraform_review" and span.attributes["openclaw.toolName"] != "friday_gitops_review" and span.attributes["openclaw.toolName"] != "friday_unified_pr_review" and span.attributes["openclaw.toolName"] != "friday_batch_pr_review" and span.attributes["openclaw.toolName"] != "friday_jira_get_context" and span.attributes["openclaw.toolName"] != "friday_jira_prepare_ticket"'
          - 'set(span.events, nil)'
          - 'set(span.links, nil)'
          - 'set(span.trace_state, "")'
          - 'set(span.status.message, "")'

exporters:
  otlphttp/phoenix:
    traces_endpoint: http://phoenix:6006/v1/traces

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/known, transform/privacy]
      exporters: [otlphttp/phoenix]
